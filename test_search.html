<!DOCTYPE html>
<html>
<head>
    <title>Ekkilo Search Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🔍 Ekkilo Search Test</h1>
    
    <div>
        <input type="text" id="searchInput" placeholder="Enter product (e.g., oil, rice, milk)" value="oil" style="padding: 10px; width: 300px;">
        <button onclick="testSearch()">Test Search</button>
    </div>
    
    <div id="results"></div>

    <script>
        async function testSearch() {
            const query = document.getElementById('searchInput').value;
            const results = document.getElementById('results');
            
            results.innerHTML = '<p>⏳ Searching for "' + query + '"...</p>';
            
            try {
                const response = await fetch('https://ekkilo.onrender.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: query,
                        lat: 17.6868,
                        lng: 83.2185,
                        radius: 5
                    })
                });
                
                const data = await response.json();
                
                let html = '<h2 class="success">✅ API Response:</h2>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                // Analysis
                html += '<h2>📊 Analysis:</h2>';
                html += '<ul>';
                html += '<li><strong>Stores found:</strong> ' + (data.stores ? data.stores.length : 0) + '</li>';
                html += '<li><strong>Total price:</strong> ₹' + (data.total || 0) + '</li>';
                html += '<li><strong>Savings:</strong> ₹' + (data.savings || 0) + '</li>';
                
                if (data.stores && data.stores.length > 0) {
                    html += '<li class="success">✅ Products found in stores!</li>';
                    data.stores.forEach(store => {
                        html += '<li>🏪 <strong>' + store.store + '</strong>: ' + store.items.length + ' items, ₹' + store.total + '</li>';
                    });
                } else {
                    html += '<li class="error">❌ No stores found!</li>';
                    html += '<li class="error">This means either:</li>';
                    html += '<ul>';
                    html += '<li>❌ Product "' + query + '" is not in the <code>products</code> table</li>';
                    html += '<li>❌ No stores have this product in <code>store_products</code> table</li>';
                    html += '<li>❌ All matching products are out of stock</li>';
                    html += '</ul>';
                }
                
                html += '</ul>';
                
                results.innerHTML = html;
                
            } catch (error) {
                results.innerHTML = '<h2 class="error">❌ Error:</h2><pre>' + error.message + '</pre>';
            }
        }
        
        // Auto-run on load
        window.onload = () => testSearch();
    </script>
</body>
</html>
