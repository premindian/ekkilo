services:
  - type: web
    name: ekkilo
    env: python
    buildCommand: "bash build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: DEV_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "https://ekkilo.onrender.com,https://www.ekkilo.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BREAK_GLASS_SECRET
        sync: false
